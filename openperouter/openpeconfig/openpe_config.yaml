l3vnis:
  - vrf: red
    vni: 100
l2vnis:
  - vni: 210
    vrf: red
    l2gatewayips:
      - "192.168.110.1/24"
    hostmaster:
      type: linux-bridge
      linuxBridge:
        name: br0
underlays:
  - asn: 64514
    evpn:
      vtepcidr: 100.65.0.0/24
    nics:
      - enp2s0
    neighbors:
      - asn: 64512
        address: 192.168.111.1
rawfrrconfigs:
  - rawConfig: |
      router bgp 64514 vrf red
        address-family ipv4 unicast
          network 192.168.110.2/32
        exit-address-family
      exit
