log file /etc/frr/frr.log debug

debug zebra events
debug zebra vxlan
debug bgp zebra
debug zebra nht
debug zebra kernel
debug zebra rib
debug zebra nexthop
debug bgp neighbor-events
debug bgp updates
debug bgp keepalives
debug bgp nht
!
vrf default
 vni 100
exit-vrf
!
router bgp 64512
 bgp router-id 100.64.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 192.168.111.80 remote-as 64514
 !
 address-family ipv4 unicast
  neighbor 192.168.111.80 activate
  network 100.64.0.1/32
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.111.80 activate
  advertise-all-vni
  advertise-svi-ip
  default-originate ipv4
  vni 100
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
